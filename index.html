<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ВТекст</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Бот">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0b">
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #2f2f2f 0, transparent 25%), radial-gradient(circle at 80% 0%, #4a5568 0, transparent 20%), linear-gradient(135deg, #0b0b0b, #1a1a1a 60%, #0b0b0b);
      color: #f3f3f3;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 14px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }
    .logo {
      width: 88px;
      height: 88px;
      object-fit: contain;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      margin: 0 auto 16px;
      display: block;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 10px;
      letter-spacing: 0.3px;
    }
    p {
      margin: 0 0 24px;
      color: #d8d8d8;
      line-height: 1.6;
      font-size: 15px;
    }
    .steps {
      text-align: left;
      margin: 0 0 24px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.55;
    }
    .steps li {
      margin-bottom: 8px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f80ed, #56ccf2);
      color: #0b1220;
      font-weight: 700;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 8px 30px rgba(79, 172, 254, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 16px rgba(79, 172, 254, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Логотип бота">
    <h1>ВТекст</h1>
    <p>Добавьте эту страницу на экран домой, чтобы быстро переходить к боту в Telegram.</p>
    <ol class="steps">
      <li>Откройте меню «Поделиться».</li>
      <li>Выберите «На экран домой» (или «Add to Home Screen»).</li>
      <li>Подтвердите добавление ярлыка.</li>
    </ol>
    <a class="btn" href="https://t.me/VText_Transcribe_Bot?start">Открыть в Telegram</a>
  </div>
  <script>
    const target = "https://t.me/VText_Transcribe_Bot?start";
    const isStandalone = () =>
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;

    if (isStandalone()) {
      // Если открыто с ярлыка, сразу отправляем в Telegram.
      window.location.replace(target);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }
  </script>
</body>
</html>
